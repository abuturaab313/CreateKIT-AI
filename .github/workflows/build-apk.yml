name: Build and Release Debug APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Temurin Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Verify Java environment
        run: |
          echo "=== Java Environment Verification ==="
          java -version
          echo "JAVA_HOME: ${JAVA_HOME}"
          if [ -z "${JAVA_HOME}" ]; then
            echo "::error::JAVA_HOME is not set."
            exit 1
          fi
          JAVA_VER_STRING=$(java -version 2>&1 | awk -F '"' '/version/ {print $2}')
          echo "Detected Java version string: ${JAVA_VER_STRING}"
          if [ -z "${JAVA_VER_STRING}" ]; then
            echo "::error::Could not detect Java version."
            exit 1
          fi
          JAVA_MAJOR=$(echo "${JAVA_VER_STRING}" | awk -F '.' '{if ($1 == "1") {print $2} else {print $1}}')
          echo "Detected Java major version: ${JAVA_MAJOR}"
          if [ -z "${JAVA_MAJOR}" ] || [ "${JAVA_MAJOR}" -lt 17 ]; then
            echo "::error::Java major version must be 17 or higher (detected: ${JAVA_MAJOR})."
            exit 1
          fi
          echo "Java environment verified successfully: Java ${JAVA_MAJOR} is active."

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Create temporary debug keystore
        run: |
          echo "=== Checking Temporary Debug Keystore ==="
          if [ -f "./debug.keystore" ]; then
            echo "debug.keystore already exists in workspace root."
          else
            echo "Generating temporary debug.keystore..."
            keytool -genkeypair \
              -v \
              -keystore ./debug.keystore \
              -alias androiddebugkey \
              -keypass android \
              -storepass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
            if [ ! -f "./debug.keystore" ]; then
              echo "::error::Failed to generate temporary debug.keystore."
              exit 1
            fi
            echo "Temporary debug.keystore generated successfully."
          fi

      - name: Build debug APK
        run: |
          echo "=== Building Debug APK ==="
          gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Verify APK
        run: |
          echo "=== Verifying Debug APK Output ==="
          EXPECTED_APK="app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -f "${EXPECTED_APK}" ]; then
            echo "::error::Expected debug APK not found at ${EXPECTED_APK}."
            echo "Listing files under app/build/outputs/apk if directory exists:"
            if [ -d "app/build/outputs/apk" ]; then
              find app/build/outputs/apk -type f -name "*.apk"
            fi
            exit 1
          fi
          if [ ! -s "${EXPECTED_APK}" ]; then
            echo "::error::The generated APK at ${EXPECTED_APK} is empty."
            exit 1
          fi
          case "${EXPECTED_APK}" in
            *.apk) ;;
            *) echo "::error::File does not have .apk extension."; exit 1 ;;
          esac
          echo "Debug APK verified successfully at: ${EXPECTED_APK}"
          ls -la "${EXPECTED_APK}"

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Prepare APK release asset
        id: prepare_asset
        run: |
          echo "=== Preparing APK Release Asset ==="
          RAW_REPO_NAME="${{ github.event.repository.name }}"
          if [ -z "${RAW_REPO_NAME}" ]; then
            RAW_REPO_NAME="android-app"
          fi
          SANITIZED_NAME=$(echo "${RAW_REPO_NAME}" | sed 's/[^a-zA-Z0-9._-]/-/g' | sed 's/--*/-/g' | sed 's/^-//;s/-$//')
          if [ -z "${SANITIZED_NAME}" ]; then
            SANITIZED_NAME="android-app"
          fi
          RELEASE_ASSET_NAME="${SANITIZED_NAME}-debug-build-${{ github.run_number }}.apk"
          TMP_RELEASE_DIR=$(mktemp -d -t apk-release-XXXXXX)
          ASSET_FULL_PATH="${TMP_RELEASE_DIR}/${RELEASE_ASSET_NAME}"
          cp "app/build/outputs/apk/debug/app-debug.apk" "${ASSET_FULL_PATH}"
          if [ ! -s "${ASSET_FULL_PATH}" ]; then
            echo "::error::Failed to copy APK to release asset staging path."
            exit 1
          fi
          echo "Release asset prepared at: ${ASSET_FULL_PATH}"
          echo "asset_path=${ASSET_FULL_PATH}" >> "$GITHUB_OUTPUT"
          echo "asset_name=${RELEASE_ASSET_NAME}" >> "$GITHUB_OUTPUT"

      - name: Publish APK to GitHub Releases
        id: publish_release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "=== Publishing APK to GitHub Releases ==="
          gh --version
          ASSET_PATH="${{ steps.prepare_asset.outputs.asset_path }}"
          ASSET_NAME="${{ steps.prepare_asset.outputs.asset_name }}"
          if [ ! -f "${ASSET_PATH}" ] || [ ! -s "${ASSET_PATH}" ]; then
            echo "::error::Release asset file is invalid or missing at ${ASSET_PATH}."
            exit 1
          fi
          case "${ASSET_PATH}" in
            *.apk) ;;
            *) echo "::error::Asset file must be an APK."; exit 1 ;;
          esac

          RELEASE_TAG="debug-apk-build-${{ github.run_number }}-${{ github.run_attempt }}"
          RELEASE_TITLE="Debug APK Build #${{ github.run_number }}"
          
          RELEASE_NOTES=$(cat << 'EOF'
          ### Debug APK Build Details
          - **Build Type**: Automatically generated debug APK
          - **Built By**: GitHub Actions
          - **Run Number**: ${{ github.run_number }}
          - **Run Attempt**: ${{ github.run_attempt }}
          - **Source Commit SHA**: `${{ github.sha }}`
          - **Target Environment**: Testing / Debugging
          - **Notice**: This APK is intended for testing purposes and is not a Play Store production release. It is signed only with a temporary debug keystore.
          EOF
          )

          echo "Creating GitHub Release with tag: ${RELEASE_TAG}"
          gh release create "${RELEASE_TAG}" "${ASSET_PATH}#${ASSET_NAME}" \
            --title "${RELEASE_TITLE}" \
            --target "${{ github.sha }}" \
            --latest \
            --notes "${RELEASE_NOTES}"
          
          echo "release_tag=${RELEASE_TAG}" >> "$GITHUB_OUTPUT"
          echo "release_title=${RELEASE_TITLE}" >> "$GITHUB_OUTPUT"

      - name: Report APK download result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "=== APK Download & Release Summary ==="
          if [ "${{ steps.publish_release.outcome }}" = "success" ]; then
            RELEASE_TAG="debug-apk-build-${{ github.run_number }}-${{ github.run_attempt }}"
            RELEASE_TITLE="Debug APK Build #${{ github.run_number }}"
            REPO_URL="${{ github.server_url }}/${{ github.repository }}"
            RELEASE_URL="${REPO_URL}/releases/tag/${RELEASE_TAG}"
            ASSET_NAME="${{ steps.prepare_asset.outputs.asset_name }}"

            echo "GitHub Release published successfully!"
            echo "Release Tag: ${RELEASE_TAG}"
            echo "Release Title: ${RELEASE_TITLE}"
            echo "Release Page URL: ${RELEASE_URL}"
            echo "APK Asset Filename: ${ASSET_NAME}"

            if command -v gh >/dev/null 2>&1; then
              gh release view "${RELEASE_TAG}" || true
            fi

            {
              echo "### 🚀 Debug APK Build & Release Succeeded"
              echo ""
              echo "- **Release Page**: [${RELEASE_TITLE}](${RELEASE_URL})"
              echo "- **Release Tag**: \`${RELEASE_TAG}\`"
              echo "- **Direct Download**: Download \`${ASSET_NAME}\` directly from the **Assets** section of the [Release Page](${RELEASE_URL})."
              echo "- **Backup Artifact**: The standard GitHub Actions artifact **\`app-debug-apk\`** is also available under the workflow run summary."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::GitHub Release publishing did not complete successfully or was skipped."
            echo "The debug APK was built successfully and uploaded as a GitHub Actions artifact."
            echo "Artifact Name: app-debug-apk"

            {
              echo "### ⚠️ Debug APK Built Successfully (Release Publishing Warning)"
              echo ""
              echo "- **Build Status**: The debug APK was compiled successfully."
              echo "- **Actions Artifact**: Download **\`app-debug-apk\`** from the workflow run summary **Artifacts** section."
              echo "- **Release Notice**: Direct GitHub Release publishing could not be completed; please use the Actions artifact above."
            } >> "$GITHUB_STEP_SUMMARY"
          fi
